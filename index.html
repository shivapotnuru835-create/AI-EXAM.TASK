        let height = [1, 8, 6, 2, 5, 4, 8, 3, 7];

        let max = 0;

        for (let i = 0; i < height.length; i++) {

            for (let j = i + 1; j < height.length; j++) {

                let width = j - i;

                let h = Math.min(height[i], height[j]);

                let area = width * h;

                if (area > max) {
                    max = area;
                }
            }
        }
